server {
  listen 80;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;

  # The POS dashboard is private: every response says noindex. nginx does not inherit add_header into a
  # location that sets its own, so each location repeats it. Never block these paths in robots.txt,
  # or crawlers cannot see the noindex.
  add_header X-Robots-Tag "noindex, nofollow" always;

  # long-cache the hashed build assets
  location /assets/ {
    expires 1y;
    add_header Cache-Control "public, immutable";
    add_header X-Robots-Tag "noindex, nofollow" always;
    try_files $uri =404;
  }

  # SPA: every other path falls back to index.html
  location / {
    add_header X-Robots-Tag "noindex, nofollow" always;
    try_files $uri $uri/ /index.html;
  }

  gzip on;
  gzip_types text/css application/javascript application/json image/svg+xml;
  gzip_min_length 1024;
}
